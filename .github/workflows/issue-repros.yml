name: Issue reproducers

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: godjot-issue-repro-${{ github.event.pull_request.number || 'default' }}
  cancel-in-progress: false

jobs:
  test:
    # A changed base branch needs a new comparison. Body and title edits do not.
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/issue-repro

  replay:
    needs: test
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)
    permissions:
      contents: read
      issues: read
    env:
      REPRO_CACHE: out/issue-repro/cache
    outputs:
      stats: ${{ steps.run.outputs.stats }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.sha || '' }}
          fetch-depth: 2
      - name: Prepare PR comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          tmp=$(mktemp -d "$RUNNER_TEMP/repro-XXXXXXXX")
          git checkout --detach "$GITHUB_SHA"
          git worktree add --detach "$tmp/base" "$BASE_SHA"
          # Both executions use the reviewed harness, publisher allowlist, build
          # commands, and reference pin from the exact base of the tested merge.
          git restore --source="$BASE_SHA" --worktree -- .issue-repro.toml scripts/issue-repro
          echo "BASE_CHECKOUT=$tmp/base" >> "$GITHUB_ENV"
          echo "REPRO_CACHE=$tmp/merge-cache" >> "$GITHUB_ENV"
      - name: Scan open and closed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/issue-repro/repro.py --cache "$REPRO_CACHE" scan
      - name: Replay the same cases on the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cd "$BASE_CHECKOUT"
          base_cache=$(mktemp -d "$RUNNER_TEMP/base-observations-XXXXXXXX")
          cp "$REPRO_CACHE/cases.json" "$base_cache/cases.json"
          rc=0
          GITHUB_OUTPUT="$base_cache/result" GITHUB_STEP_SUMMARY="" \
            scripts/issue-repro/repro.py --cache "$base_cache" run || rc=$?
          # A completed red replay produces stats too. Only import observations
          # from a complete replay of this exact commit. Otherwise the merge
          # starts with no baseline and cannot emit a false transition.
          if (( rc <= 1 )) && test -s "$base_cache/result" &&
             sed -n 's/^stats=//p' "$base_cache/result" |
             jq -se --arg sha "$BASE_SHA" 'length == 1 and .[0].revision == $sha' >/dev/null; then
            if test -f "$base_cache/history.db"; then
              cp "$base_cache/history.db" "$REPRO_CACHE/history.db"
            fi
          else
            echo "::warning::Base replay incomplete; merge results have no comparison baseline."
          fi
      - name: Restore default-branch results
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: out/issue-repro/cache/history.db
          key: godjot-repro-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: godjot-repro-history-v1-
      - name: Run approved cases
        id: run
        run: scripts/issue-repro/repro.py --cache "$REPRO_CACHE" run
      - name: Preserve results including observed failures
        if: ${{ !cancelled() && github.event_name != 'pull_request' && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') && hashFiles('out/issue-repro/cache/history.db') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: out/issue-repro/cache/history.db
          key: godjot-repro-history-v1-${{ github.run_id }}-${{ github.run_attempt }}

  pr-comment:
    name: Update PR replay comment
    needs: replay
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.replay.outputs.stats != '' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Pin the publisher that receives the write token, independently of the tested PR.
          ref: 7694ac89654ab5bf6154643cb98c317b0edae775
          persist-credentials: false
      - name: Post or update replay statistics on this PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_REPRO_BASE_SHA: ${{ github.base_ref == github.event.repository.default_branch && github.event.pull_request.base.sha || '' }}
          ISSUE_REPRO_HEAD_SHA: ${{ github.base_ref == github.event.repository.default_branch && github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_JSON: ${{ needs.replay.outputs.stats }}
        run: python3 scripts/issue-repro/pr_comment.py --pr "$PR_NUMBER"
