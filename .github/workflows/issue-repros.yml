name: Issue reproducers

on:
  pull_request:
    paths:
      - '.github/workflows/issue-repros.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.issue-repro.toml'
      - 'scripts/issue-repro/**'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: godjot-issue-repro-${{ github.event.pull_request.number || 'default' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/issue-repro

  replay:
    needs: test
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)
    permissions:
      contents: read
      issues: read
    env:
      # Each PR compares against its previous completed replay. The default
      # branch retains its existing history key.
      HISTORY_PREFIX: ${{ github.event_name == 'pull_request' && format('godjot-pr-{0}-history-v1-', github.event.pull_request.number) || 'godjot-repro-history-v1-' }}
    outputs:
      stats: ${{ steps.run.outputs.stats }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan open and closed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/issue-repro/repro.py scan
      - name: Restore previous results
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: out/issue-repro/cache/history.db
          key: ${{ env.HISTORY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.HISTORY_PREFIX }}
      - name: Run approved cases
        id: run
        run: scripts/issue-repro/repro.py run
      - name: Preserve results including observed failures
        if: ${{ !cancelled() && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') && hashFiles('out/issue-repro/cache/history.db') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: out/issue-repro/cache/history.db
          key: ${{ env.HISTORY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}

  dashboard:
    needs: replay
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
          && github.ref_name == github.event.repository.default_branch
          && needs.replay.outputs.stats != '' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Update the reproducer status issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: ${{ needs.replay.outputs.stats }}
        run: python3 scripts/issue-repro/dashboard.py

  pr-comment:
    name: Update PR replay comment
    needs: replay
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.replay.outputs.stats != '' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Post or update replay statistics on this PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_JSON: ${{ needs.replay.outputs.stats }}
        run: python3 scripts/issue-repro/dashboard.py --pr "$PR_NUMBER"
